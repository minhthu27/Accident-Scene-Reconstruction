# Default Training Hyperparameters for YOLO11
epochs: 150
batch: 16
imgsz: 640
patience: 30
optimizer: "AdamW"
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 5.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5
cls: 0.5
dfl: 1.5

# Augmentations (Standard)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10.0
translate: 0.1
scale: 0.5
shear: 2.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.1
copy_paste: 0.1
erasing: 0.4
cos_lr: true
close_mosaic: 15
amp: true

# Environment
workers: 4
cache: false
seed: 42
deterministic: true
plots: true
save_period: 25
val: true
verbose: true
